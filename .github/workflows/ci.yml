name: CI Pipeline

on:
  push:
    branches: [ main, master, develop, spam-detect-prototype ]
  pull_request:
    branches: [ main, master, spam-detect-prototype ]

env:
  PYTHON_VERSION: '3.11'

jobs:
  linting:
    name: Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-lint-${{ hashFiles('requirements.txt', 'requirements-ml.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-lint-
      - name: Install dependencies
        run: |
          pip install --quiet flake8==6.1.0
          pip install --quiet -r requirements-ml.txt
          pip install --quiet -r requirements.txt
      - name: Run flake8
        run: flake8 app/ --max-line-length=120 --extend-ignore=E203,W503 --statistics --count

  testing:
    name: Testing
    runs-on: ubuntu-latest
    needs: linting
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-test-${{ hashFiles('requirements.txt', 'requirements-ml.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-test-
      - name: Install dependencies
        run: |
          pip install --quiet -r requirements-ml.txt
          pip install --quiet -r requirements.txt
          pip install --quiet pytest pytest-cov
      - name: Run pytest
        run: pytest tests/ -v --tb=short --cov=app --cov-report=term-missing

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [linting, testing]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-
      - name: Build Docker image
        run: docker build -t spam-detector:test .
      - name: Verify image
        run: docker images | grep spam-detector

  security:
    name: Security Check
    runs-on: ubuntu-latest
    needs: linting
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-sec-${{ hashFiles('requirements.txt', 'requirements-ml.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-sec-
      - name: Install bandit
        run: |
          pip install --quiet bandit
          pip install --quiet -r requirements-ml.txt
      - name: Run bandit
        run: bandit -r app/ -ll -f custom -q 2>&1 | tee /dev/stderr || echo "[ XX ] Security issues found"
